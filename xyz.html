<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Live SMS Tester | Dharatatva</title>
  
  <!-- Firebase SDKs (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f7f5f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 28px; border: 1px solid #e5e0d8; }
    h2 { color: #1e3a2f; font-size: 22px; margin-bottom: 6px; text-align: center; font-weight: 700; }
    p.subtitle { color: #6b7280; font-size: 13px; text-align: center; margin-bottom: 24px; }
    
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .phone-wrap { display: flex; gap: 8px; }
    .prefix { background: #f3f4f6; border: 1.5px solid #d1d5db; border-radius: 8px; padding: 12px 14px; font-weight: 600; color: #4b5563; font-size: 15px; }
    input[type="tel"], input[type="text"] { width: 100%; border: 1.5px solid #d1d5db; border-radius: 8px; padding: 12px 14px; font-size: 16px; outline: none; transition: 0.2s border; }
    input:focus { border-color: #1e3a2f; }

    .btn { width: 100%; background: #1e3a2f; color: #ffffff; border: none; border-radius: 8px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s opacity; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-green { background: #15803d; }

    #recaptcha-container { display: flex; justify-content: center; margin: 16px 0; }
    
    .otp-section { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #d1d5db; }
    
    /* Live Log Console */
    .log-box { margin-top: 24px; background: #111827; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #9ca3af; max-height: 160px; overflow-y: auto; }
    .log-entry { margin-bottom: 4px; }
    .log-success { color: #34d399; font-weight: bold; }
    .log-error { color: #f87171; font-weight: bold; }
    .log-info { color: #60a5fa; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Dharatatva SMS Test</h2>
    <p class="subtitle">Live HTTPS Carrier SMS Dispatch Verification</p>

    <!-- Step 1: Mobile Number -->
    <div class="input-group">
      <label for="phoneInput">Enter Mobile Number</label>
      <div class="phone-wrap">
        <span class="prefix">+91</span>
        <input type="tel" id="phoneInput" placeholder="9876543210" maxlength="10">
      </div>
    </div>

    <!-- reCAPTCHA Placeholder -->
    <div id="recaptcha-container"></div>

    <button id="sendBtn" class="btn" onclick="sendOtp()">
      <span>📲 Send Carrier SMS</span>
    </button>

    <!-- Step 2: OTP Verification -->
    <div id="otpSection" class="otp-section">
      <div class="input-group">
        <label for="otpInput">Enter 6-Digit SMS Code</label>
        <input type="text" id="otpInput" placeholder="123456" maxlength="6" style="letter-spacing: 6px; text-align: center; font-weight: 700;">
      </div>
      <button id="verifyBtn" class="btn btn-green" onclick="verifyOtp()">
        <span>✓ Verify & Confirm</span>
      </button>
    </div>

    <!-- Realtime Event Logs -->
    <div class="log-box" id="logBox">
      <div class="log-entry log-info">[Init] Ready for testing on dharatatva.in</div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // Apne cart.js se DHT_FIREBASE_CONFIG yahan verify karein
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAKpooar-vhIeIN0blajoIy3zuLUcOafWQ", // Apna complete API key check karein
      authDomain: "dharatatva-auth.firebaseapp.com",
      projectId: "dharatatva-auth",
      storageBucket: "dharatatva-auth.appspot.com",
      messagingSenderId: "367258079633",
      appId: "1:367258079633:web:0d33e5c707dca098"
    };

    // Firebase Init
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    let confirmationResult = null;
    let recaptchaVerifier = null;

    // Helper: Screen Log
    function addLog(msg, type = 'info') {
      const box = document.getElementById("logBox");
      const d = new Date();
      const time = d.toTimeString().split(' ')[0];
      const div = document.createElement("div");
      div.className = `log-entry log-${type}`;
      div.innerText = `[${time}] ${msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // reCAPTCHA Verifier
    function setupRecaptcha() {
      if (recaptchaVerifier) {
        try { recaptchaVerifier.clear(); } catch(e) {}
        recaptchaVerifier = null;
      }
      
      // Live HTTPS par normal checkbox sabse reliable aur bot-free hota hai
      recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'normal',
        'callback': (response) => {
          addLog("reCAPTCHA tick verified by Google!", "success");
        },
        'expired-callback': () => {
          addLog("reCAPTCHA expired. Please tick again.", "error");
        }
      });
      recaptchaVerifier.render();
    }

    // Step 1: Send SMS
    async function sendOtp() {
      const phone = document.getElementById("phoneInput").value.trim();
      const sendBtn = document.getElementById("sendBtn");

      if (phone.length !== 10 || isNaN(phone)) {
        addLog("Please enter a valid 10-digit number", "error");
        return;
      }

      sendBtn.disabled = true;
      addLog(`Initiating dispatch for +91${phone}...`, "info");

      try {
        if (!recaptchaVerifier) {
          setupRecaptcha();
        }

        const formattedPhone = "+91" + phone;
        confirmationResult = await firebase.auth().signInWithPhoneNumber(formattedPhone, recaptchaVerifier);
        
        addLog(`SUCCESS: Carrier SMS sent to ${formattedPhone}`, "success");
        
        // Show OTP box
        document.getElementById("otpSection").style.display = "block";
        document.getElementById("otpInput").focus();
      } catch (err) {
        addLog(`ERROR: ${err.code} - ${err.message}`, "error");
        console.error("Firebase Auth Error:", err);
        // Reset verifier so user can retry immediately
        setupRecaptcha();
      } finally {
        sendBtn.disabled = false;
      }
    }

    // Step 2: Verify SMS OTP
    async function verifyOtp() {
      const code = document.getElementById("otpInput").value.trim();
      const verifyBtn = document.getElementById("verifyBtn");

      if (code.length !== 6) {
        addLog("Please enter 6-digit verification code", "error");
        return;
      }

      verifyBtn.disabled = true;
      addLog(`Verifying code ${code}...`, "info");

      try {
        const result = await confirmationResult.confirm(code);
        const user = result.user;
        addLog(`PHONE VERIFIED SUCCESSFULLY! UID: ${user.uid}`, "success");
        alert("Mobile number verified successfully via Carrier SMS!");
      } catch (err) {
        addLog(`VERIFY FAILED: ${err.code} - ${err.message}`, "error");
      } finally {
        verifyBtn.disabled = false;
      }
    }

    // Window load par reCAPTCHA render karein
    window.addEventListener("DOMContentLoaded", () => {
      setupRecaptcha();
    });
  </script>
</body>
</html>
